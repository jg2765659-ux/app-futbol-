<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Partidos - Fútbol</title>
    <!-- Tailwind CSS CDN para estilos rápidos y modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Encabezado -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-emerald-400 flex items-center gap-2">
                ⚽ Marcadores y Horarios
            </h1>
            <!-- Configuración opcional de API Key -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="password" id="apiKeyInput" placeholder="API Key (Opcional)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-48">
                <button onclick="cargarPartidos()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition">Conectar</button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        
        <!-- Barra de Búsqueda y Filtros -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6 justify-between items-center">
            <input type="text" id="searchInput" oninput="filtrarPartidos()" placeholder="Buscar equipo o torneo..." class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-72">
            
            <div class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                <button onclick="cambiarFiltro('todos')" id="btn-todos" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white transition">Todos</button>
                <button onclick="cambiarFiltro('hoy')" id="btn-hoy" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Hoy</button>
            </div>
        </div>

        <!-- Estado de carga / Mensajes -->
        <div id="statusMessage" class="text-center text-slate-400 py-4 hidden">Cargando partidos...</div>

        <!-- Contenedor de Tarjetas de Partidos -->
        <div id="matchesContainer" class="grid grid-cols-1 gap-4">
            <!-- Los partidos se inyectan aquí mediante JavaScript -->
        </div>
    </main>

    <!-- Lógica de la Aplicación -->
    <script>
        // Datos de respaldo (Mock) para que funcione sin API Key de inmediato
        const mockData = {
            matches: [
                {
                    competition: { name: "UEFA Champions League" },
                    status: "TIMED",
                    utcDate: new Date(Date.now() + 3600000 * 3).toISOString(), // En 3 horas
                    homeTeam: { name: "Real Madrid", crest: "https://crests.football-data.org/86.svg" },
                    awayTeam: { name: "Manchester City", crest: "https://crests.football-data.org/65.svg" },
                    score: { fullTime: { home: null, away: null } }
                },
                {
                    competition: { name: "Liga MX" },
                    status: "IN_PLAY",
                    utcDate: new Date().toISOString(),
                    homeTeam: { name: "Toluca", crest: "https://crests.football-data.org/1858.svg" },
                    awayTeam: { name: "América", crest: "https://crests.football-data.org/1854.svg" },
                    score: { fullTime: { home: 2, away: 1 } }
                },
                {
                    competition: { name: "Premier League" },
                    status: "FINISHED",
                    utcDate: new Date(Date.now() - 86400000).toISOString(), // Ayer
                    homeTeam: { name: "Arsenal", crest: "https://crests.football-data.org/57.svg" },
                    awayTeam: { name: "Liverpool", crest: "https://crests.football-data.org/64.svg" },
                    score: { fullTime: { home: 1, away: 1 } }
                }
            ]
        };

        let partidosGlobales = [];
        let filtroActual = 'todos';

        async function cargarPartidos() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const container = document.getElementById('matchesContainer');
            const statusMsg = document.getElementById('statusMessage');

            if (!apiKey) {
                partidosGlobales = mockData.matches;
                statusMsg.classList.add('hidden');
                statusMsg.classList.remove('text-amber-400');
                statusMsg.classList.add('text-slate-400');
                actualizarVista();
                return;
            }

            statusMsg.textContent = 'Cargando partidos...';
            statusMsg.classList.remove('text-amber-400');
            statusMsg.classList.add('text-slate-400');
            statusMsg.classList.remove('hidden');
            container.innerHTML = '';
            let mensajeError = '';

            try {
                const response = await fetch('https://api.football-data.org/v4/matches', {
                    headers: { 'X-Auth-Token': apiKey }
                });

                if (!response.ok) throw new Error('Error al conectar con la API (Verifica tu clave)');
                
                const data = await response.json();
                if (!Array.isArray(data.matches)) throw new Error('La respuesta de la API no contiene partidos válidos');
                partidosGlobales = data.matches;
                actualizarVista();
            } catch (error) {
                mensajeError = `${error.message}. Se muestran datos de prueba.`;
                partidosGlobales = mockData.matches;
                actualizarVista();
            } finally {
                if (mensajeError) {
                    statusMsg.textContent = mensajeError;
                    statusMsg.classList.remove('hidden', 'text-slate-400');
                    statusMsg.classList.add('text-amber-400');
                } else {
                    statusMsg.classList.add('hidden');
                    statusMsg.classList.remove('text-amber-400');
                    statusMsg.classList.add('text-slate-400');
                }
            }
        }

        function escaparHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[caracter]);
        }

        function actualizarVista() {
            const query = document.getElementById('searchInput').value.trim().toLocaleLowerCase();
            const hoy = new Date().toDateString();
            const filtrados = partidosGlobales.filter(partido => {
                const coincideBusqueda = [
                    partido.homeTeam?.name,
                    partido.awayTeam?.name,
                    partido.competition?.name
                ].some(nombre => String(nombre ?? '').toLocaleLowerCase().includes(query));
                const coincideFecha = filtroActual !== 'hoy' || new Date(partido.utcDate).toDateString() === hoy;
                return coincideBusqueda && coincideFecha;
            });
            renderizarPartidos(filtrados);
        }

        function renderizarPartidos(partidos) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (partidos.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8">No se encontraron partidos.</div>`;
                return;
            }

            partidos.forEach(partido => {
                const fecha = new Date(partido.utcDate);
                if (Number.isNaN(fecha.getTime())) return;
                const fechaLocal = escaparHtml(fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                const fechaDia = escaparHtml(fecha.toLocaleDateString([], { month: 'short', day: 'numeric' }));
                const nombreCompeticion = escaparHtml(partido.competition?.name || 'Competición');
                const nombreLocal = escaparHtml(partido.homeTeam?.name || 'Local');
                const nombreVisitante = escaparHtml(partido.awayTeam?.name || 'Visitante');
                const escudoLocal = obtenerEscudo(partido.homeTeam?.crest);
                const escudoVisitante = obtenerEscudo(partido.awayTeam?.crest);
                const golesLocal = partido.score?.fullTime?.home;
                const golesVisitante = partido.score?.fullTime?.away;
                const hayMarcador = Number.isFinite(golesLocal) && Number.isFinite(golesVisitante);

                let badgeEstado = '';
                if (partido.status === 'IN_PLAY') {
                    badgeEstado = `<span class="bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-full text-xs font-bold animate-pulse">EN VIVO</span>`;
                } else if (partido.status === 'FINISHED') {
                    badgeEstado = `<span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full text-xs font-semibold">FINALIZADO</span>`;
                } else {
                    badgeEstado = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full text-xs font-semibold">${fechaDia} - ${fechaLocal}</span>`;
                }

                const card = `
                    <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4 hover:border-slate-600 transition">
                        <div class="text-center md:text-left">
                            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">${nombreCompeticion}</span>
                            <div class="text-xs text-slate-400 mt-0.5">${fechaDia} a las ${fechaLocal}</div>
                        </div>

                        <div class="flex items-center justify-center gap-6 w-full md:w-auto">
                            <!-- Local -->
                            <div class="flex items-center gap-3 justify-end w-36 sm:w-44">
                                <span class="text-sm font-bold text-right truncate">${nombreLocal}</span>
                                ${escudoLocal ? `<img src="${escudoLocal}" alt="" class="w-8 h-8 object-contain" onerror="this.remove()">` : ''}
                            </div>

                            <!-- Marcador / VS -->
                            <div class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-center font-black text-lg min-w-[70px]">
                                ${hayMarcador ? `${golesLocal} - ${golesVisitante}` : 'VS'}
                            </div>

                            <!-- Visitante -->
                            <div class="flex items-center gap-3 justify-start w-36 sm:w-44">
                                ${escudoVisitante ? `<img src="${escudoVisitante}" alt="" class="w-8 h-8 object-contain" onerror="this.remove()">` : ''}
                                <span class="text-sm font-bold text-left truncate">${nombreVisitante}</span>
                            </div>
                        </div>

                        <div>
                            ${badgeEstado}
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function obtenerEscudo(url) {
            try {
                const direccion = new URL(url);
                return direccion.protocol === 'https:' ? escaparHtml(direccion.href) : '';
            } catch {
                return '';
            }
        }

        function filtrarPartidos() {
            actualizarVista();
        }

        function cambiarFiltro(tipo) {
            filtroActual = tipo;
            const btnTodos = document.getElementById('btn-todos');
            const btnHoy = document.getElementById('btn-hoy');

            if(tipo === 'todos') {
                btnTodos.className = "px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white transition";
                btnHoy.className = "px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            } else {
                btnHoy.className = "px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white transition";
                btnTodos.className = "px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
            }
            actualizarVista();
        }

        // Cargar datos por defecto al iniciar
        cargarPartidos();
    </script>
</body>
</html>
